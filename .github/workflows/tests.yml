name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 규칙 탐지기만 테스트하므로 API 키가 필요 없다.
      - run: pip install pytest
      - run: python -m pytest -q tests
